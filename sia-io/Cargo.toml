[package]
name = "sia-io"
version = "0.1.0"
edition = "2024"

[features]
renterd = ["dep:chrono", "dep:reqwest", "dep:serde_json"]

[dependencies]
bon = "3.9"
chrono = { version = "0.4", features = ["serde"], optional = true }
ct-codecs = "1.1"
derive-where = { version = "1.6", features = ["zeroize", "serde"] }
futures-io = "0.3"
futures-util = { version = "0.3", features = ["io"] }
mime = "0.3"
reqwest = { version = "0.13", features = ["stream", "json", "query"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "2.0"
typed-path = "0.12"
zeroize = { version = "1.8", features = ["serde", "derive"] }

[dev-dependencies]
anyhow = "1.0"
dotenv = "0.15"
tokio = { version = "1.51", features = ["full"] }