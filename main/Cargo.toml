[package]
name = "sia_nfs"
version = "0.3.0"
edition = "2024"

[dependencies]
sia-io = { path = "../sia-io", features = ["indexd", "renterd"] }
sia-vfs = { path = "../sia-vfs", features = ["indexd", "renterd"] }
foyer-cache = { path = "../foyer-cache" }

anyhow = { workspace = true, features = ["backtrace"] }
async-trait = { workspace = true }
bimap = { workspace = true }
bytes = { workspace = true }
bytesize = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
ct-codecs = { workspace = true }
futures = "0.3"
futures-util = { workspace = true }
humantime = "2.1"
itertools = { workspace = true }
moka = { workspace = true, features = ["future"] }
nfsserve = "0.10"
parking_lot = { workspace = true }
renterd_client = { git = "https://github.com/rrauch/renterd_client.git", rev = "11e947e7861e690c9d36ccf2702e0012c9f97eca" }
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono"] }
synonym = "0.1"
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zeroize = { workspace = true }

[build-dependencies]
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono"] }
tokio = { workspace = true, features = ["full"] }
