[package]
name = "foyer-cache"
version = "0.1.0"
edition = "2024"

[features]
default = ["indexd", "renterd"]
indexd = ["sia-io/indexd"]
renterd = ["sia-io/renterd"]

[dependencies]
sia-io = { path = "../sia-io", default-features = false }

async-trait = { workspace = true }
blocking = "1.6"
bon = { workspace = true }
equivalent = "1"
foyer = { version = "0.22", features = ["default", "serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
dotenv = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
